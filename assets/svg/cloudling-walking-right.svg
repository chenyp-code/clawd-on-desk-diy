<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <defs>
    <style>
      .walk-bob { transform-origin: 7.5px 15px; animation: walk-bob 0.5s infinite linear; }
      @keyframes walk-bob { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0, -0.5px); } }
    </style>
  </defs>
  <g class="walk-bob">
    <rect x="0" y="2" width="15" height="13" fill="#888" />
  </g>
</svg>
